# ==============================================================================
# application.yml — cấu hình api-gateway (SL-1.2)
#
# 12-factor (AGENTS.md §6): giá trị phụ thuộc môi trường đọc từ env; file này chỉ giữ default
# hợp lý cho máy dev. Bảng routing nằm ở đây — KHÔNG hard-code trong code.
# ==============================================================================

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

shoplab:
  env: ${APP_ENV:local}
  debug-endpoints: ${SHOPLAB_DEBUG_ENDPOINTS:false}
  git-commit: ${SHOPLAB_GIT_COMMIT:unknown}

  # Readiness = TCP check tới identity (đúng cơ chế của template). Gateway không có DB nên không
  # check DB. Host/port khai riêng (không suy ra từ URL) vì đây là cơ chế chung của commons.
  readiness:
    dependencies:
      - name: identity-service
        host: ${IDENTITY_SERVICE_HOST:localhost}
        port: ${IDENTITY_SERVICE_PORT:8081}
        timeout: 500ms

  gateway:
    # Path KHÔNG cần token. Mọi path khác bắt buộc token (kể cả /version).
    #
    # SL-1.5: catalog là service ĐẦU TIÊN có endpoint public + protected trên cùng prefix
    # (`GET /v1/products` public, `POST/PUT/DELETE` cần token). Cơ chế public-path ở đây là
    # theo PATH, không theo METHOD ⇒ phải để cả prefix đi qua, và **catalog tự chặn** phần ghi
    # (nó verify JWT tại chỗ — defense in depth).
    #
    # Đánh đổi đã chấp nhận: gateway không còn là chốt 401 cho các path này; nó chỉ xoá header
    # danh tính client tự gửi, còn authorization do service quyết. Muốn gateway làm cả hai thì
    # phải thêm public-path theo (method + path) — làm khi có nhu cầu thật (Phase 3+).
    public-paths:
      - /v1/auth/**
      - /v1/products/**
      - /v1/categories/**
      # SL-2.7: webhook provider không thể mang JWT (provider không có token) ⇒ gateway cho đi qua và
      # payment tự verify HMAC-SHA256 trên raw body + timestamp. Trang thanh toán giả cũng public,
      # nhưng chỉ tồn tại khi PAYMENT_MOCK_ENABLED=true (và guard chặn ngoài local).
      - /v1/webhooks/**
      - /mock-provider/**
      # SL-2.1: khách CHƯA đăng nhập vẫn phải có giỏ ⇒ cả prefix phải qua được gateway. Authorization
      # nằm ở cart-service: có JWT → giỏ user, không có → bắt buộc X-Cart-Token do server cấp.
      - /v1/carts/**
      # SL-2.13: tra giá nhiều SKU là đường ĐỌC (giá niêm yết vốn công khai, guest xem giỏ cũng cần)
      # ⇒ public như /v1/products/**.
      - /v1/skus/**
      - /.well-known/**
      # SL-1.8: spec OpenAPI của chính gateway (chỉ bật ở local — xem springdoc.api-docs.enabled).
      - /v3/api-docs
      - /health
      - /ready

    jwt:
      # Lấy JWKS qua mạng nội bộ, KHÔNG qua chính gateway (tránh phụ thuộc vòng).
      jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      # Phải KHỚP `IDENTITY_JWT_ISSUER` của identity-service, nếu không mọi token đều bị 401.
      issuer: ${IDENTITY_JWT_ISSUER:https://identity.shoplab.local}
      jwks-cache-ttl: ${GATEWAY_JWKS_CACHE_TTL:5m}
      # Khoảng cách tối thiểu giữa 2 lần nạp lại JWKS do gặp kid lạ (chặn dội).
      min-refresh-interval: ${GATEWAY_JWKS_MIN_REFRESH_INTERVAL:10s}
      clock-skew: ${GATEWAY_JWT_CLOCK_SKEW:30s}

    # Timeout bắt buộc: không có timeout = service đích treo sẽ kéo sập gateway.
    timeouts:
      connect: ${GATEWAY_CONNECT_TIMEOUT:2s}
      read: ${GATEWAY_READ_TIMEOUT:5s}

    # Bảng route: prefix dài nhất thắng. Thêm service mới = thêm 1 dòng ở đây, không sửa code.
    routes:
      - path-prefix: /v1/auth
        base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      - path-prefix: /v1/users
        base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      # SL-1.4: endpoint quản trị phải đi qua CỬA VÀO DUY NHẤT như mọi API khác — nếu không thì
      # client phải gọi thẳng port service (và bỏ qua luôn việc verify token ở gateway).
      - path-prefix: /v1/admin
        base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      # SL-1.5: catalog-service. Prefix dài nhất thắng, nên /v1/products/* và /v1/categories/*
      # đi thẳng tới catalog (không đụng /v1/users của identity).
      - path-prefix: /v1/products
        base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
      - path-prefix: /v1/categories
        base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
      # SL-2.13: tra giá nhiều SKU (batch) — saga checkout + giỏ hàng dùng để lấy giá thật.
      - path-prefix: /v1/skus
        base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
      # SL-2.2: inventory-service (reserve/commit/release). Cần token — không nằm trong public-paths.
      - path-prefix: /v1/stock
        base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
      # SL-2.4: promotion-service (voucher lock/commit/release + admin CRUD). Cần token.
      - path-prefix: /v1/vouchers
        base-url: ${PROMOTION_SERVICE_URL:http://localhost:8086}
      # SL-2.5: order-service (tạo/xem đơn + chuyển trạng thái). Cần token.
      - path-prefix: /v1/orders
        base-url: ${ORDER_SERVICE_URL:http://localhost:8087}
      # SL-2.6a: checkout saga (orchestration). Cần token — buyer đặt hàng từ giỏ của chính mình.
      - path-prefix: /v1/checkout
        base-url: ${ORDER_SERVICE_URL:http://localhost:8087}
      # SL-2.7: payment-service (payment intent). Cần token.
      - path-prefix: /v1/payment-intents
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8088}
      # SL-2.7: webhook provider — PUBLIC (xác thực bằng HMAC ở payment, không JWT) và trang thanh
      # toán giả. Hai prefix này KHÔNG nằm trong `routes` chung của /v1/payment-intents vì
      # public-path ở gateway là theo PATH, không theo method.
      - path-prefix: /v1/webhooks
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8088}
      - path-prefix: /mock-provider
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8088}
      # SL-2.1: cart-service. Prefix này là PUBLIC (guest không có JWT) — cart tự phân xử danh tính
      # (JWT hoặc X-Cart-Token do chính nó cấp).
      - path-prefix: /v1/carts
        base-url: ${CART_SERVICE_URL:http://localhost:8083}
      # JWKS công bố qua gateway để client chỉ cần biết MỘT địa chỉ.
      - path-prefix: /.well-known
        base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

logging:
  level:
    root: INFO
    com.shoplab: ${LOG_LEVEL:INFO}


# --- OpenAPI (SL-1.8) ---
# Chỉ để XUẤT spec (docs/api/openapi.yaml), không phục vụ client thật.
# `OpenApiEnvironmentPostProcessor` (commons) ép `false` khi APP_ENV != local ⇒ mặc định fail-closed:
# spec là bản đồ hệ thống, không được lộ ở môi trường thật.
springdoc:
  api-docs:
    enabled: ${SHOPLAB_OPENAPI_ENABLED:true}
    path: /v3/api-docs
