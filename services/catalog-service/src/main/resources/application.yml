# ==============================================================================
# application.yml — cấu hình catalog-service (SL-1.5)
#
# Nguyên tắc 12-factor (AGENTS.md §6): mọi giá trị phụ thuộc môi trường đọc từ env;
# file này chỉ giữ default hợp lý cho máy dev. Không hard-code secret.
# ==============================================================================

spring:
  application:
    name: catalog-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # Database RIÊNG của service (database per service — AGENTS.md §6).
    # Tên DB do init script của Postgres tạo sẵn (xem infra/init/01-create-databases.sh).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_CATALOG:catalog}
    username: ${POSTGRES_USER:shoplab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Catalog là service read-heavy đầu tiên nhưng Phase 1 vẫn chỉ 1 instance.
      # Để pool nhỏ và đo thật ở Phase 4 thay vì đoán.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 1
      connection-timeout: 3000
      pool-name: catalog-pool

  jpa:
    hibernate:
      # Schema là việc của FLYWAY. `validate` để entity lệch migration là chết ngay lúc khởi động.
      ddl-auto: validate
    # Tắt Open Session In View: giữ connection suốt request là nguyên nhân kinh điển của "hết
    # pool" khi tải cao. Entity → DTO phải map trong tầng service.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    # ⚠️ FAIL-CLOSED (SL-1.15): mặc định CHỈ `db/migration` — seed dev KHÔNG nạp.
    # Seed (`db/seed/R__seed_dev_data.sql`) chỉ được thêm vào bằng env, và chỉ compose local + IT
    # làm việc đó. Nếu để seed chung `db/migration` thì staging/prod cũng có 20 product "Du lieu dev".
    locations: ${SHOPLAB_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false

  # SL-3.6: catalog là PRODUCER (outbox + relay) ⇒ cần broker. Producer confirm bật "correlated":
  # relay chỉ đánh SENT khi broker đã xác nhận nhận message (không phải khi TCP write xong).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:shoplab}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    # KHÔNG khai listener: catalog không consume event nào (chỉ search-service consume product event).

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

shoplab:
  env: ${APP_ENV:local}
  debug-endpoints: ${SHOPLAB_DEBUG_ENDPOINTS:false}
  git-commit: ${SHOPLAB_GIT_COMMIT:unknown}

  jwt:
    # Catalog là RESOURCE SERVER: không giữ private key, chỉ tải public key qua JWKS của
    # identity-service. Nhờ vậy xoay khoá ở identity không phải deploy lại catalog.
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # PHẢI khớp `IDENTITY_JWT_ISSUER` của identity-service, nếu không mọi token đều bị 401.
    issuer: ${IDENTITY_JWT_ISSUER:https://identity.shoplab.local}

  readiness:
    dependencies:
      # Phase 1 giữ check mức TCP (như template). Check sâu (SELECT 1) — xem revisit ADR-0004.
      - name: postgres
        host: ${POSTGRES_HOST:localhost}
        port: ${POSTGRES_PORT:5432}
        timeout: 500ms
      # SL-3.6: KHÔNG đưa rabbitmq vào readiness. Producer mà broker chết thì API vẫn phải 200
      # (event nằm chờ trong outbox, relay gửi bù) — báo "chưa sẵn sàng" vì broker chết sẽ biến một
      # sự cố async thành sự cố cả catalog (đúng bài học ADR-0007: async không nằm trên critical path).

  # SL-3.6: outbox relay (chép khuôn SL-3.3). `interval` 1 s ⇒ index trễ tối đa ~1 s so với catalog.
  outbox:
    interval: ${SHOPLAB_OUTBOX_INTERVAL:1s}
    initial-delay: ${SHOPLAB_OUTBOX_INITIAL_DELAY:5s}
    batch-size: ${SHOPLAB_OUTBOX_BATCH_SIZE:100}
    claim-timeout: ${SHOPLAB_OUTBOX_CLAIM_TIMEOUT:30s}

  events:
    enabled: true
    # Catalog CHỈ phát event, không consume ⇒ không cần bảng dedupe. Để `true` thì commons tạo bảng
    # `processed_events` rỗng trong DB catalog — bảng chết, gây hiểu nhầm là service có consumer.
    dedup:
      auto-create-schema: false

logging:
  level:
    root: INFO
    com.shoplab: ${LOG_LEVEL:INFO}

# --- OpenAPI (SL-1.8) ---
# Chỉ để XUẤT spec (docs/api/openapi.yaml), không phục vụ client thật.
# `OpenApiEnvironmentPostProcessor` (commons) ép `false` khi APP_ENV != local ⇒ mặc định fail-closed:
# spec là bản đồ hệ thống, không được lộ ở môi trường thật.
springdoc:
  api-docs:
    enabled: ${SHOPLAB_OPENAPI_ENABLED:true}
    path: /v3/api-docs
