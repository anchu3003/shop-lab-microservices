# ==============================================================================
# application.yml — cấu hình payment-service (SL-2.7)
#
# Nguyên tắc 12-factor (AGENTS.md §6): mọi giá trị phụ thuộc môi trường đọc từ env; file này chỉ giữ
# default hợp lý cho máy dev. Không hard-code secret (PAYMENT_WEBHOOK_SECRET là REQUIRED env).
# ==============================================================================

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Job dọn idempotency chạy fixedDelay trên 1 thread; `await-termination` để shutdown không cắt
  # ngang transaction (bài học SL-2.3/SL-2.5: cắt ngang ⇒ log "Connection is closed").
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: 10s

  datasource:
    # Database RIÊNG của service (database per service — AGENTS.md §6).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_PAYMENT:payment}
    username: ${POSTGRES_USER:shoplab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Đường ghi ở đây ngắn (insert intent / update trạng thái) nhưng có webhook là đường public:
      # giữ pool nhỏ để thấy nghẽn thật ở Phase 4 thay vì che bằng 50 connection.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:6}
      minimum-idle: 1
      connection-timeout: 3000
      pool-name: payment-pool

  flyway:
    enabled: true
    # FAIL-CLOSED: chỉ migration, không seed dữ liệu tài chính.
    locations: ${SHOPLAB_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

shoplab:
  env: ${APP_ENV:local}
  debug-endpoints: ${SHOPLAB_DEBUG_ENDPOINTS:false}
  git-commit: ${SHOPLAB_GIT_COMMIT:unknown}

  jwt:
    # payment là RESOURCE SERVER: chỉ tải public key qua JWKS của identity.
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # PHẢI khớp `IDENTITY_JWT_ISSUER` của identity-service, nếu không mọi token đều bị 401.
    issuer: ${IDENTITY_JWT_ISSUER:https://identity.shoplab.local}

  readiness:
    dependencies:
      - name: postgres
        host: ${POSTGRES_HOST:localhost}
        port: ${POSTGRES_PORT:5432}
        timeout: 500ms

  payment:
    # Intent sống 15 phút — khớp TTL reservation (inventory) và voucher lock (promotion):
    # checkout giữ cả ba trong cùng một phiên thanh toán.
    intent-ttl: ${PAYMENT_INTENT_TTL:15m}
    # Tên provider. Phase 2 luôn là `mock`; cột `provider` có sẵn để sau này trộn provider thật.
    provider: ${PAYMENT_PROVIDER:mock}
    # Trang thanh toán trả cho client (mock provider của chính service, expose qua gateway).
    checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:http://localhost:8080/mock-provider/pay}
    # Secret HMAC-SHA256 để verify webhook. REQUIRED (validate ở RequiredEnv) — không có default.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    # Cửa sổ chống replay: timestamp lệch quá mức này thì từ chối (401).
    webhook-tolerance: ${PAYMENT_WEBHOOK_TOLERANCE:5m}
    # Mock provider chỉ được bật ở local/test — bật ở môi trường khác là CHẾT LÚC BOOT (fail-closed).
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    # Độ trễ giả lập của provider (ADR-0006 D4 ước lượng p99 ~50 ms cho payment-intent).
    mock-latency: ${PAYMENT_MOCK_LATENCY:50ms}
    # Dọn `idempotency_keys` (copy pattern SL-2.5): COMPLETED giữ 24h, IN_PROGRESS mồ côi 1h.
    idempotency-retention: ${PAYMENT_IDEMPOTENCY_RETENTION:24h}
    in-progress-stale-after: ${PAYMENT_IDEMPOTENCY_STALE_AFTER:1h}
    sweep-batch-size: ${PAYMENT_IDEMPOTENCY_SWEEP_BATCH:200}
    sweep-interval-ms: ${SHOPLAB_PAYMENT_SWEEP_INTERVAL_MS:3600000}
    sweep-initial-delay-ms: ${SHOPLAB_PAYMENT_SWEEP_INITIAL_DELAY_MS:600000}

logging:
  level:
    root: INFO
    com.shoplab: ${LOG_LEVEL:INFO}

# --- OpenAPI (SL-1.8) ---
# Chỉ để XUẤT spec (docs/api/openapi.yaml), không phục vụ client thật.
# `OpenApiEnvironmentPostProcessor` (commons) ép `false` khi APP_ENV != local ⇒ fail-closed.
springdoc:
  api-docs:
    enabled: ${SHOPLAB_OPENAPI_ENABLED:true}
    path: /v3/api-docs
