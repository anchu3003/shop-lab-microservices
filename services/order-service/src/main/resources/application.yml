# ==============================================================================
# application.yml — cấu hình order-service (SL-2.2)
#
# Nguyên tắc 12-factor (AGENTS.md §6): mọi giá trị phụ thuộc môi trường đọc từ env; file này chỉ giữ
# default hợp lý cho máy dev. Không hard-code secret.
# ==============================================================================

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Scheduler của sweeper (SL-2.3): 1 thread là đủ (job tuần tự, fixedDelay).
  # `await-termination` để lúc shutdown KHÔNG cắt ngang transaction đang chạy — nếu cắt, connection bị
  # đóng giữa lúc rollback và log đầy lỗi "Connection is closed" (đã gặp trong IT).
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: 10s

  datasource:
    # Database RIÊNG của service (database per service — AGENTS.md §6).
    # Tên DB do init script của Postgres tạo sẵn (infra/init/01-create-databases.sh).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_ORDER:order}
    username: ${POSTGRES_USER:shoplab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      # Phase 2 chỉ 1 instance. Reserve là write-heavy nhưng đoạn critical rất ngắn (1 câu UPDATE);
      # giữ pool nhỏ để thấy nghẽn thật ở Phase 4 thay vì che nó bằng 50 connection.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:6}
      minimum-idle: 1
      connection-timeout: 3000
      pool-name: order-pool

  flyway:
    enabled: true
    # FAIL-CLOSED: chỉ migration, không có seed (SL-1.15). Tồn kho tạo bằng PUT /v1/stock/{skuId}.
    locations: ${SHOPLAB_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

shoplab:
  env: ${APP_ENV:local}
  debug-endpoints: ${SHOPLAB_DEBUG_ENDPOINTS:false}
  git-commit: ${SHOPLAB_GIT_COMMIT:unknown}

  jwt:
    # order là RESOURCE SERVER: chỉ tải public key qua JWKS của identity.
    jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # PHẢI khớp `IDENTITY_JWT_ISSUER` của identity-service, nếu không mọi token đều bị 401.
    issuer: ${IDENTITY_JWT_ISSUER:https://identity.shoplab.local}

  readiness:
    dependencies:
      # Phase 2 giữ check mức TCP (revisit ADR-0004: check sâu khi ≥ 2 service cần).
      - name: postgres
        host: ${POSTGRES_HOST:localhost}
        port: ${POSTGRES_PORT:5432}
        timeout: 500ms

  order:
    # Giữ response của idempotency 24 h (ADR-0006 D2): client retry muộn vẫn được dedupe.
    idempotency-retention: ${ORDER_IDEMPOTENCY_RETENTION:24h}
    # Row IN_PROGRESS cũ hơn mức này coi là mồ côi (process chết) và bị dọn — nếu không, client nhận 409 vĩnh viễn.
    in-progress-stale-after: ${ORDER_IDEMPOTENCY_STALE_AFTER:1h}
    sweep-batch-size: ${ORDER_IDEMPOTENCY_SWEEP_BATCH:200}
    # Job dọn idempotency (TD-14) chạy mỗi giờ là đủ — không phải job realtime.
    sweep-interval-ms: ${SHOPLAB_ORDER_SWEEP_INTERVAL_MS:3600000}
    sweep-initial-delay-ms: ${SHOPLAB_ORDER_SWEEP_INITIAL_DELAY_MS:600000}

  # --- SL-2.6a: checkout saga gọi các service khác (sync REST, ADR-0006 D4) ---
  # URL phải cấu hình được: compose dùng hostname nội bộ, máy dev dùng localhost, IT dùng stub HTTP.
  # Timeout là BẮT BUỘC: sync mà không có timeout thì một service chậm giữ connection của
  # order-service tới khi client bỏ đi (cạn pool của chính mình).
  saga:
    cart-url: ${SAGA_CART_URL:http://localhost:8083}
    catalog-url: ${SAGA_CATALOG_URL:http://localhost:8082}
    inventory-url: ${SAGA_INVENTORY_URL:http://localhost:8084}
    promotion-url: ${SAGA_PROMOTION_URL:http://localhost:8086}
    payment-url: ${SAGA_PAYMENT_URL:http://localhost:8088}
    connect-timeout: ${SAGA_CONNECT_TIMEOUT:2s}
    # 800 ms/bước: ADR-0006 chốt 300–800 ms để tổng 4-5 bước vẫn nằm dưới NFR p99 < 500 ms khi
    # mọi thứ khoẻ; chậm hơn nghĩa là fail-fast chứ không kéo lê.
    read-timeout: ${SAGA_READ_TIMEOUT:800ms}
    currency: ${SAGA_CURRENCY:VND}

logging:
  level:
    root: INFO
    com.shoplab: ${LOG_LEVEL:INFO}

# --- OpenAPI (SL-1.8) ---
# Chỉ để XUẤT spec (docs/api/openapi.yaml), không phục vụ client thật.
# `OpenApiEnvironmentPostProcessor` (commons) ép `false` khi APP_ENV != local ⇒ fail-closed.
springdoc:
  api-docs:
    enabled: ${SHOPLAB_OPENAPI_ENABLED:true}
    path: /v3/api-docs
