# ==============================================================================
# ci.yml — CI pipeline cho ShopLab (SL-0.5)
#
# Mục tiêu: mỗi lần push / mở PR, pipeline tự chạy lint -> test -> build Docker
# image và kết quả hiện ngay trên PR. CHƯA deploy (CD) và CHƯA push image lên
# registry — để Phase 7 (architecture.md §10.3).
#
# 4 job:
#   lint        — Checkstyle (lint) + Spotless (format check).  SONG SONG với test.
#   test        — unit test + JaCoCo coverage gate.              SONG SONG với lint.
#   build-image — build Docker image của MỌI service (matrix, SL-1.12): hiện 3 job con
#                 (service-template · identity-service · api-gateway).  SAU khi lint+test xanh.
#
# Vì sao tách lint và test thành 2 job (không gộp):
#   1. CI UI chỉ rõ job/step nào đỏ -> đọc log nhanh, đúng chỗ.
#   2. Hai job độc lập -> chạy song song, giảm thời gian pipeline.
#   3. Job test skip checkstyle/spotless (đã có job lint làm) -> không chạy 2 lần
#      cùng một việc.
#
# Vì sao build-image phải chờ lint+test:
#   Build image cho code đã fail lint/test là đốt minutes vô ích. Repo private +
#   gói Free chỉ có 2.000 phút Actions/tháng, và build image là job nặng nhất.
#
# Liên quan: AGENTS.md §6 · architecture.md §10.3 · Backlog.md -> SL-0.5 (dựng CI), SL-1.0 (tối ưu chi phí)
#
# Tối ưu chi phí (SL-1.0) — lý do của từng mảnh cấu hình:
#   - `paths-ignore`: run chỉ đổi docs (.md, docs/, .clinerules/, .cline/) KHÔNG cần build/test.
#     Số đo thật trước tối ưu: 11/18 run (62% số phút) chỉ là docs.
#   - `push` chỉ trên `main`: nhánh feature đã có run `pull_request` -> bỏ run trùng
#     (số đo thật: 9 run push trên nhánh feature = 49% số phút).
#   - `vars.CI_ENABLED`: kill-switch bằng CONFIG, không cần sửa file:
#       tắt:  gh variable set CI_ENABLED --body false      (job bị skip -> không đốt phút)
#       bật:  gh variable set CI_ENABLED --body true       (hoặc xoá variable)
#   - PR ở dạng draft -> skip cho tới khi bấm "Ready for review" (nhờ `ready_for_review` trong types).
# ==============================================================================

name: CI

on:
  # Push CHỈ trên `main`: nhánh feature đã có run `pull_request` -> không chạy 2 lần cho 1 commit.
  push:
    branches: [main]
    # Run chỉ đổi docs thì không cần build/test. KHÔNG ignore `.github/**` (đổi workflow phải
    # được CI kiểm chứng), `.editorconfig`/`.gitattributes` (ảnh hưởng format/line-ending),
    # `tools/**`, `infra/**`.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.clinerules/**'
      - '.cline/**'
      - 'LICENSE'
  # PR vào main. Thêm `ready_for_review` để PR draft bị skip nhưng chạy ngay khi bấm Ready.
  #
  # LƯU Ý: `paths-ignore` chỉ bỏ run khi **toàn bộ** diff là docs. Commit docs nằm trong PR **có code**
  # vẫn tạo run `pull_request` mới (vì PR diff có code) → commit đó thêm `[skip ci]` trong message.
  # Từ flow "1 ticket = 1 commit" (xem .clinerules/10-git-workflow.md), mark done được gộp vào commit CUỐI
  # (có code) nên mặc định **không cần** token skip; token chỉ dùng khi cố ý push commit docs riêng.
  # GitHub đọc skip instruction ở **HEAD commit của PR**.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.clinerules/**'
      - '.cline/**'
      - 'LICENSE'

# Gom nhóm theo REF (`refs/heads/<branch>` khi push, `refs/pull/<N>/merge` khi PR):
# push và PR là 2 group KHÁC nhau nên KHÔNG huỷ nhau. Chỉ huỷ run cũ **cùng ref** —
# đúng chỗ cần tiết kiệm (push liên tiếp cùng nhánh, hoặc PR cập nhật liên tục).
#
# Vì sao KHÔNG gom push+PR vào cùng group (đã thử và bỏ): khi đó run PR sẽ huỷ run
# push của cùng commit, để lại 3 check `cancelled` trên commit → PR hiện "check fail"
# dù code sạch, và sau này bật required-checks sẽ bị chặn oan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI chỉ cần đọc source, không ghi gì lên repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # lint — Checkstyle (lint) + Spotless (format)
  # ---------------------------------------------------------------------------
  lint:
    name: lint (checkstyle + spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kill-switch (`vars.CI_ENABLED`) + bỏ qua PR draft — chi tiết ở comment đầu file (SL-1.0).
    if: ${{ vars.CI_ENABLED != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tách 2 step để CI UI chỉ rõ cái nào đỏ. Checkstyle chạy TRƯỚC để lỗi
      # hiện dạng `file:line: error` (dễ đọc hơn diff format của Spotless).
      # Không dùng -q: cần thấy output vi phạm trong log CI.
      - name: Checkstyle (lint)
        run: mvn -B -ntp checkstyle:check

      - name: Spotless (format check)
        run: mvn -B -ntp spotless:check

  # ---------------------------------------------------------------------------
  # test — unit test + JaCoCo coverage gate
  # ---------------------------------------------------------------------------
  test:
    name: test (unit + jacoco gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Kill-switch (`vars.CI_ENABLED`) + bỏ qua PR draft — chi tiết ở comment đầu file (SL-1.0).
    if: ${{ vars.CI_ENABLED != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` = compile + test + jacoco report + jacoco:check (gate >= 80% LINE
      # cho package config/health — khai ở services/service-template/pom.xml).
      # Skip spotless/checkstyle vì job lint đã chạy chúng.
      - name: Verify (test + coverage gate)
        run: mvn -B -ntp verify -Dcheckstyle.skip=true -Dspotless.check.skip=true

  # ---------------------------------------------------------------------------
  # build-image — build Docker image của MỌI service (matrix, SL-1.12)
  #
  # Vì sao matrix: trước SL-1.12 job này hard-code `service-template` (viết ở SL-0.5 khi repo chỉ có
  # 1 service) ⇒ Dockerfile của `identity-service`/`api-gateway` KHÔNG được CI kiểm — CI xanh nhưng
  # image build có thể hỏng. Thêm service mới = thêm 1 dòng trong `matrix.service`.
  #
  # Vì sao `SKIP_TESTS=true`: job `test` đã chạy test cho cả reactor; chạy lại test bên trong image
  # chỉ tốn phút CI (SL-1.0 đo: build-image chiếm 46%). `docker build` TAY vẫn test (mặc định false).
  # ---------------------------------------------------------------------------
  build-image:
    name: build-image (${{ matrix.service }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Kill-switch (`vars.CI_ENABLED`) + bỏ qua PR draft — chi tiết ở comment đầu file (SL-1.0).
    if: ${{ vars.CI_ENABLED != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    strategy:
      # 1 service lỗi KHÔNG chặn service khác → thấy ngay service nào hỏng, không phải chạy lại để biết.
      fail-fast: false
      matrix:
        # Thêm service mới ⇒ thêm tên thư mục trong services/ vào đây.
        service: [service-template, identity-service, catalog-service, inventory-service, promotion-service, order-service, payment-service, cart-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      # Docker có sẵn trên runner ubuntu-latest. Build context PHẢI là gốc repo (Dockerfile cần
      # parent pom.xml + packages/service-commons). GIT_COMMIT hiện ở GET /version.
      - name: Build image (${{ matrix.service }})
        run: |
          docker build \
            --file services/${{ matrix.service }}/Dockerfile \
            --build-arg GIT_COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg SKIP_TESTS=true \
            --tag shoplab-${{ matrix.service }}:ci \
            .

      - name: Show image
        run: docker image ls shoplab-${{ matrix.service }}:ci
