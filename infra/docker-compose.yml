# ==============================================================================
# infra/docker-compose.yml — hạ tầng nền local của ShopLab  (ticket SL-0.3)
#
# Chạy (từ THƯ MỤC GỐC repo):
#   cp .env.example .env                                            # 1 lần
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#   docker compose -f infra/docker-compose.yml --env-file .env ps
#   # `service-template` là service MẪU, nằm trong profile `template` ⇒ `up -d` mặc định KHÔNG dựng nó:
#   docker compose -f infra/docker-compose.yml --env-file .env --profile template up -d service-template
#
# Vì sao phải có --env-file:
#   Compose nạp file `.env` từ *project directory*, mặc định là **thư mục chứa file
#   compose** (`infra/`) — KHÔNG phải thư mục đang đứng. `.env` của repo nằm ở gốc
#   nên phải chỉ định tường minh. (Đây là bẫy thật, xem Backlog.md → SL-0.3 learning note.)
#
# Nguyên tắc:
#   - KHÔNG hard-code password trong file này: biến nhạy cảm dùng `${VAR:?}` (BẮT BUỘC),
#     thiếu là compose báo lỗi ngay thay vì âm thầm chạy bằng password mặc định yếu
#     (AGENTS.md §6, §9). Biến không nhạy cảm (port, tên DB, user) mới có `:-default`.
#   - Tên container prefix `shoplab-` để dễ filter khi debug.
#   - Dữ liệu dùng NAMED VOLUME, KHÔNG bind mount (ADR-0002 — WSL2/Windows perf).
#   - Image alpine nhưng vẫn có healthcheck tool (pg_isready / redis-cli /
#     rabbitmq-diagnostics / wget).
# ==============================================================================

name: shoplab

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — 1 instance, nhiều database (database per service, AGENTS.md §6)
  # 7 DB được tạo bởi infra/init/01-create-databases.sh lần đầu khởi tạo volume.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shoplab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
      POSTGRES_DB: ${POSTGRES_USER:-shoplab}
      POSTGRES_DB_IDENTITY: ${POSTGRES_DB_IDENTITY:-identity}
      POSTGRES_DB_CATALOG: ${POSTGRES_DB_CATALOG:-catalog}
      POSTGRES_DB_INVENTORY: ${POSTGRES_DB_INVENTORY:-inventory}
      POSTGRES_DB_PROMOTION: ${POSTGRES_DB_PROMOTION:-promotion}
      POSTGRES_DB_ORDER: ${POSTGRES_DB_ORDER:-order}
      POSTGRES_DB_PAYMENT: ${POSTGRES_DB_PAYMENT:-payment}
      POSTGRES_DB_NOTIFICATION: ${POSTGRES_DB_NOTIFICATION:-notification}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shoplab-pg-data:/var/lib/postgresql/data
      # Init script: chỉ chạy khi data dir còn rỗng (lần đầu / sau reset -v).
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `$$` để Compose không interpolate, shell trong container tự resolve.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # Redis — cache / lock / rate limit (Phase 4+)
  # Có requirepass: `redis-cli ping` trần sẽ báo NOAUTH, phải `-a $REDIS_PASSWORD`.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shoplab-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - shoplab-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # RabbitMQ — message broker cho Phase 3 (ADR-0001: RabbitMQ trước, Kafka sau).
  # Management UI ở cổng 15672.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shoplab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shoplab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - shoplab-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # Adminer — UI xem dữ liệu Postgres (nhẹ, 1 container; thay cho pgAdmin).
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: shoplab-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # service-template — service mẫu (SL-0.4), build từ source trong repo.
  # Chứng minh template chạy được cùng hạ tầng: /ready check TCP tới postgres + redis.
  #
  # SL-1.13: nằm trong profile `template` ⇒ `up -d` mặc định KHÔNG dựng nó (service mẫu,
  # không thuộc hệ thống thật). Chạy khi cần:
  #   docker compose -f infra/docker-compose.yml --env-file .env --profile template up -d service-template
  # ---------------------------------------------------------------------------
  service-template:
    # Profile `template`: chỉ dựng khi truyền `--profile template` — xem comment trên.
    profiles: [template]
    build:
      # Context là GỐC repo vì service cần parent pom.xml + module packages/service-commons.
      context: ..
      dockerfile: services/service-template/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: shoplab-service-template:local
    container_name: shoplab-service-template
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${SERVICE_TEMPLATE_PORT:-8090}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Endpoint /debug/* chỉ dùng để verify hạ tầng — bật ở local, tắt ở môi trường khác.
      SHOPLAB_DEBUG_ENDPOINTS: ${SHOPLAB_DEBUG_ENDPOINTS:-true}
      # Trỏ tới service name trong network của compose, KHÔNG phải localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${SERVICE_TEMPLATE_PORT:-8090}:${SERVICE_TEMPLATE_PORT:-8090}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `wget` có sẵn trong eclipse-temurin:21-jre-alpine (busybox).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # identity-service — service thật đầu tiên (SL-1.1): register/login + JWT RS256.
  # DB riêng (`identity`) do Flyway migrate lúc khởi động.
  #
  # Mount khoá JWT READ-ONLY: file khoá dev sinh bằng `bash tools/gen-dev-keys.sh`
  # (bị .gitignore nên KHÔNG có trong image — phải mount từ ngoài vào).
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: shoplab-identity-service:local
    container_name: shoplab-identity-service
    restart: unless-stopped
    # Chạy bằng UID/GID của user trên máy dev (vẫn KHÔNG phải root).
    # Lý do: khoá JWT mount từ host có mode 600 (đúng chuẩn cho private key) — user `shoplab`
    # trong image có uid hệ thống khác nên sẽ bị AccessDeniedException khi đọc.
    # Đặt SHOPLAB_UID/SHOPLAB_GID trong `.env` = `id -u` / `id -g` (tools/gen-dev-keys.sh in ra).
    user: "${SHOPLAB_UID:-1000}:${SHOPLAB_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${IDENTITY_SERVICE_PORT:-8081}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPLAB_DEBUG_ENDPOINTS: ${SHOPLAB_DEBUG_ENDPOINTS:-true}
      # Trỏ tới service name trong network của compose, KHÔNG phải localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_IDENTITY: ${POSTGRES_DB_IDENTITY:-identity}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.shoplab.local}
      IDENTITY_JWT_ACCESS_TTL: ${IDENTITY_JWT_ACCESS_TTL:-15m}
      # Đường dẫn TRONG container (khớp với volume mount bên dưới).
      IDENTITY_JWT_PRIVATE_KEY_PATH: /app/keys/dev-private.pem
      IDENTITY_JWT_PUBLIC_KEY_PATH: /app/keys/dev-public.pem
    volumes:
      # `./keys` tính theo thư mục chứa compose file (infra/) → infra/keys.
      - ./keys:/app/keys:ro
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:${IDENTITY_SERVICE_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `wget` có sẵn trong eclipse-temurin:21-jre-alpine (busybox).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Lần đầu chạy Flyway + khởi động JVM nên cần thời gian hơn template.
      start_period: 60s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # catalog-service — nguồn sự thật về category/product (SL-1.5).
  #
  # KHÔNG mount khoá JWT: catalog là resource server, chỉ tải public key qua JWKS của identity
  # ⇒ xoay khoá ở identity không phải build lại catalog.
  #
  # Verify JWT tại chỗ (defense in depth): gọi thẳng `localhost:8082` không token vẫn 401, và
  # header `x-user-role` do client tự gửi KHÔNG có tác dụng (catalog chỉ tin token).
  # ---------------------------------------------------------------------------
  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: shoplab-catalog-service:local
    container_name: shoplab-catalog-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${CATALOG_SERVICE_PORT:-8082}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPLAB_DEBUG_ENDPOINTS: ${SHOPLAB_DEBUG_ENDPOINTS:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_CATALOG: ${POSTGRES_DB_CATALOG:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
      # SL-1.15: seed dev CHỈ nạp khi chạy qua compose local. Image tự nó mặc định KHÔNG seed
      # (`SHOPLAB_FLYWAY_LOCATIONS=classpath:db/migration`) ⇒ staging/prod không bao giờ có dữ liệu dev.
      SHOPLAB_FLYWAY_LOCATIONS: ${SHOPLAB_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      # JWKS lấy qua network nội bộ (không qua gateway — tránh phụ thuộc vòng).
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8081/.well-known/jwks.json}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.shoplab.local}
    ports:
      - "${CATALOG_SERVICE_PORT:-8082}:${CATALOG_SERVICE_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy
      # Cần identity sống để lấy JWKS — chết từ đầu thì catalog không verify được token nào.
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # inventory-service — tồn kho (SL-2.2): reserve / commit / release.
  #
  # Chống oversell bằng conditional UPDATE trên Postgres (ADR-0006 D1) ⇒ không gọi service nào
  # khác khi xử lý request (không có phụ thuộc sync ra ngoài), chỉ cần DB + JWKS của identity.
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: ..
      dockerfile: services/inventory-service/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: shoplab-inventory-service:local
    container_name: shoplab-inventory-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${INVENTORY_SERVICE_PORT:-8084}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPLAB_DEBUG_ENDPOINTS: ${SHOPLAB_DEBUG_ENDPOINTS:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB_INVENTORY: ${POSTGRES_DB_INVENTORY:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa set — cp .env.example .env rồi chạy lại}
      # JWKS qua network nội bộ (không qua gateway — tránh phụ thuộc vòng).
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8081/.well-known/jwks.json}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.shoplab.local}
      # Tham số nghiệp vụ (ADR-0006 D1: TTL 15 phút, 1 kho ở Phase 2).
      INVENTORY_WAREHOUSE_ID: ${INVENTORY_WAREHOUSE_ID:-WH-1}
      INVENTORY_RESERVATION_TTL: ${INVENTORY_RESERVATION_TTL:-15m}
      # Sweeper TTL (SL-2.3) — đặt interval ngắn để quan sát job chạy trên stack local.
      SHOPLAB_INVENTORY_SWEEP_INTERVAL_MS: ${SHOPLAB_INVENTORY_SWEEP_INTERVAL_MS:-60000}
      SHOPLAB_INVENTORY_SWEEP_INITIAL_DELAY_MS: ${SHOPLAB_INVENTORY_SWEEP_INITIAL_DELAY_MS:-30000}
      SHOPLAB_INVENTORY_SWEEP_BATCH_SIZE: ${SHOPLAB_INVENTORY_SWEEP_BATCH_SIZE:-100}
    ports:
      - "${INVENTORY_SERVICE_PORT:-8084}:${INVENTORY_SERVICE_PORT:-8084}"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - shoplab-net

  # ---------------------------------------------------------------------------
  # api-gateway — cửa vào duy nhất (SL-1.2): route /v1/** + verify JWT qua JWKS của identity.
  #
  # Không có DB: gateway không sở hữu dữ liệu nào (architecture.md §5) → readiness check TCP
  # tới identity, không check DB.
  #
  # `IDENTITY_SERVICE_*` trỏ tới SERVICE NAME trong network của compose (không phải localhost —
  # localhost trong container là chính nó).
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: shoplab-api-gateway:local
    container_name: shoplab-api-gateway
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVER_PORT: ${API_GATEWAY_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOPLAB_DEBUG_ENDPOINTS: ${SHOPLAB_DEBUG_ENDPOINTS:-true}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8081}
      IDENTITY_SERVICE_HOST: ${IDENTITY_SERVICE_HOST:-identity-service}
      IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-8081}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8081/.well-known/jwks.json}
      # PHẢI khớp issuer mà identity phát hành, nếu không mọi token đều bị 401.
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-https://identity.shoplab.local}
      # SL-1.5: route /v1/products + /v1/categories đi tới catalog. Trong container KHÔNG dùng
      # localhost (localhost là chính gateway).
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8082}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8084}
      GATEWAY_CONNECT_TIMEOUT: ${GATEWAY_CONNECT_TIMEOUT:-2s}
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT:-5s}
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - shoplab-net

volumes:
  shoplab-pg-data:
    name: shoplab-pg-data
  shoplab-redis-data:
    name: shoplab-redis-data
  shoplab-rabbitmq-data:
    name: shoplab-rabbitmq-data

networks:
  shoplab-net:
    name: shoplab-net
