          description: Đã xác thực nhưng thiếu quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Chưa xác thực: thiếu/sai/hết hạn token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - name
    CreateProductRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        price:
          type: number
          minimum: 0.0
      required:
