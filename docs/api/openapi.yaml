openapi: 3.0.1
info:
  title: ShopLab API — Phase 1 + Phase 2 (inventory)
  version: v1
  description: 'API hiện có: identity (auth/RBAC) + catalog (product/SKU) + inventory (tồn kho) + promotion
    (voucher) + order (đơn hàng) + payment (thanh toán) + cart (giỏ hàng).


    Sinh tự động bằng `bash tools/export-openapi.sh` — KHÔNG sửa file này bằng tay.


    Mọi lỗi dùng schema `ApiError` (có `traceId` để grep log): 401 = chưa xác thực · 403 = thiếu quyền
    · 503 = dependency chết (retry được).'
servers:
- url: http://localhost:8080
  description: api-gateway — cửa vào duy nhất (verify JWT, route tới service)
tags:
- name: Admin
  description: Quản trị người dùng (chỉ role ADMIN)
- name: Auth
  description: Đăng ký / đăng nhập / refresh / logout
- name: JWKS
  description: Public key để service khác verify token
- name: User
  description: Hồ sơ người dùng hiện tại
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - JWKS
      operationId: jwks
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
        '400':
          description: Input không hợp lệ (xem `details` theo từng field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Chưa xác thực: thiếu/sai/hết hạn token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Đã xác thực nhưng thiếu quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Không tìm thấy tài nguyên
