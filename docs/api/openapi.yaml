      type: object
      properties:
        owner:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totalQty:
          type: integer
          format: int32
        ttlSeconds:
          type: integer
          format: int64
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChangeStatusRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          minLength: 0
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - name
    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          maxItems: 100
          minItems: 0
        discount:
          type: number
          minimum: 0.0
        currency:
          type: string
          pattern: '[A-Z]{3}'
      required:
      - items
    CreatePaymentIntentRequest:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          pattern: '[A-Za-z]{3}'
      required:
      - amount
      - orderId
    CreateProductRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        price:
          type: number
          minimum: 0.0
      required:
      - categoryId
      - name
      - price
    CreateSkuRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 0
        priceOverride:
          type: number
          minimum: 0.0
        stockHint:
          type: integer
          format: int32
          minimum: 0
      required:
      - code
    CreateVoucherRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
          minLength: 0
          pattern: '[A-Za-z0-9_-]+'
        type:
          type: string
          enum:
          - PERCENT
          - FIXED
        value:
          type: number
          minimum: 0.01
        maxDiscount:
          type: number
          minimum: 0.0
        minOrder:
          type: number
          minimum: 0.0
        quota:
          type: integer
          format: int32
          minimum: 1
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required:
      - code
      - endAt
      - quota
      - startAt
      - type
      - value
    CurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
    FieldViolation:
      properties:
        field:
          type: string
        message:
          type: string
    GuestCartResponse:
      type: object
      properties:
        cartToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    Item:
      type: object
      properties:
        skuId:
          type: string
          format: uuid
        qty:
          type: integer
          format: int32
          minimum: 1
      required:
      - qty
      - skuId
