          minimum: 0.0
        stockHint:
          type: integer
          format: int32
          minimum: 0
      required:
      - code
    CurrentUserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
    FieldViolation:
      properties:
        field:
          type: string
        message:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    PageResponseProductResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProductDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SkuResponse'
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        displayName:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - displayName
      - email
      - password
    SkuResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        priceOverride:
          type: number
        stockHint:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
